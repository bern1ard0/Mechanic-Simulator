# One-click deploy config for Render (https://render.com).
# Render reads this file, builds the app, and runs it on a URL you can open
# from your phone. The "disk" keeps your cars, photos, and password safe across
# restarts and redeploys.
services:
  - type: web
    name: mechanic-simulator
    runtime: node
    plan: starter            # a persistent disk requires a paid instance (~$7/mo)
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: AUTH_PASSWORD   # set this yourself in the Render dashboard (your site password)
        sync: false
      - key: SESSION_SECRET  # Render generates a strong random value for you
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data   # your cars + photos live here, and persist
      sizeGB: 1
